<!-- BARRA SUPERIOR DE NAVEGAÇÃO -->
<header class="barra-superior">
    <!-- Overlay para fechar sidebar no mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="container-barra-superior">
        <!-- Botão Hambúrguer (só mobile) -->
        <button class="btn-hamburger" id="btnHamburger" aria-label="Abrir menu" aria-expanded="false">
            <span class="hamburger-linha"></span>
            <span class="hamburger-linha"></span>
            <span class="hamburger-linha"></span>
        </button>

        <!-- Seção Esquerda -->
        <div class="secao-esquerda-barra">
            <div class="indicador-status">
                <div class="ponto-status ativo"></div>
                <span class="texto-status">IA Ativa</span>
            </div>
        </div>

        <!-- Seção Direita -->
        <div class="secao-direita-barra">
            <!-- Informações do Usuário -->
            <div class="info-usuario">
                <div class="detalhes-usuario">
                    <div class="nome-usuario">{{ usuario }}</div>
                    <div class="hospital-usuario">{{ hospital }}</div>
                </div>
                <button class="avatar-usuario" id="btnPerfil" aria-label="Menu do perfil">
                    <div class="iniciais-avatar">
                        {% if usuario %}
                            {{ usuario.split()[0][0] }}{{ usuario.split()[-1][0] if usuario.split()|length > 1 else '' }}
                        {% endif %}
                    </div>
                </button>
            </div>
        </div>
    </div>
</header>

<script>
(function() {
    var btn    = document.getElementById('btnHamburger');
    var sidebar = document.querySelector('.barra-lateral');
    var overlay = document.getElementById('sidebarOverlay');

    function abrir() {
        sidebar.classList.add('ativa');
        overlay.classList.add('ativo');
        btn.classList.add('ativo');
        btn.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
    }

    function fechar() {
        sidebar.classList.remove('ativa');
        overlay.classList.remove('ativo');
        btn.classList.remove('ativo');
        btn.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
    }

    btn.addEventListener('click', function() {
        sidebar.classList.contains('ativa') ? fechar() : abrir();
    });

    overlay.addEventListener('click', fechar);

    // Fechar com ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') fechar();
    });

    // Fechar ao clicar num link da sidebar no mobile
    document.querySelectorAll('.item-navegacao, .botao-sair').forEach(function(link) {
        link.addEventListener('click', function() {
            if (window.innerWidth <= 768) fechar();
        });
    });
})();
</script>
